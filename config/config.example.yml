# E-Commerce Analytics Platform Configuration
# Copy this file to config.yml and update with your specific settings

# Database Configuration
database:
  host: localhost
  port: 5432
  name: ecommerce_analytics
  user: analytics_user
  password: your_secure_password
  schema: public
  pool_size: 10
  max_overflow: 20
  ssl_mode: prefer

# Data Generation Settings
data_generation:
  # Sales data configuration
  sales:
    num_orders: 10000
    start_date: "2020-01-01"
    end_date: "2024-12-31"
    num_stores: 100
    num_products: 1000
    num_customers: 5000
    min_order_amount: 10.0
    max_order_amount: 2000.0
    min_quantity: 1
    max_quantity: 50
    discount_range: [0.02, 0.25]
    shipping_range: [0.05, 0.15]
    tax_rate: 0.08
  
  # Customer data configuration
  customers:
    num_customers: 5000
    primary_states: ["CA", "TX", "NY", "FL", "IL", "PA", "OH", "GA", "NC", "MI"]
    urban_percentage: 0.7
    age_range: [18, 80]
    gender_distribution:
      M: 0.48
      F: 0.50
      Other: 0.02
    segment_distribution:
      Premium: 0.15
      Regular: 0.60
      Budget: 0.20
      New: 0.05
    loyalty_tiers: ["Bronze", "Silver", "Gold", "Platinum", "Diamond"]

# File Paths and Directories
paths:
  data_dir: "data"
  raw_data: "data/raw"
  processed_data: "data/processed"
  analytics_data: "data/analytics"
  logs: "logs"
  reports: "reports"
  temp: "temp"

# Data Quality Settings
data_quality:
  min_quality_score: 95.0
  validation_rules:
    - name: "no_null_critical_fields"
      fields: ["CustomerID", "OrderID", "DateID"]
      rule: "not_null"
    - name: "positive_amounts"
      fields: ["TotalAmount", "OrderAmount"]
      rule: "positive"
    - name: "valid_dates"
      fields: ["DateID"]
      rule: "date_range"
      params:
        min_date: "20200101"
        max_date: "20241231"

# Logging Configuration
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_rotation: "1 day"
  max_file_size: "100MB"
  backup_count: 30

# Performance Settings
performance:
  batch_size: 1000
  max_workers: 4
  memory_limit: "4GB"
  cache_enabled: true
  cache_ttl: 3600

# Security Settings
security:
  encryption_enabled: true
  data_masking: true
  audit_logging: true
  access_control:
    enabled: true
    roles:
      - admin
      - analyst
      - viewer

# Monitoring and Alerting
monitoring:
  enabled: true
  metrics_collection: true
  alerting:
    enabled: true
    channels:
      - email
      - slack
    thresholds:
      data_quality_score: 95.0
      processing_time: 300  # seconds
      error_rate: 0.01

# External Integrations
integrations:
  # Cloud storage (optional)
  aws:
    enabled: false
    region: us-east-1
    s3_bucket: your-analytics-bucket
    access_key: your_access_key
    secret_key: your_secret_key
  
  google_cloud:
    enabled: false
    project_id: your-project-id
    bucket_name: your-analytics-bucket
  
  # API endpoints (for future use)
  api:
    enabled: false
    host: 0.0.0.0
    port: 8000
    cors_origins: ["http://localhost:3000"]
  
  # Business Intelligence tools
  powerbi:
    enabled: false
    workspace_id: your_workspace_id
    dataset_id: your_dataset_id

# Business Rules and Calculations
business_rules:
  # Customer segmentation thresholds
  customer_segments:
    premium_score_threshold: 120
    regular_score_threshold: 80
    budget_age_threshold: 25
  
  # Revenue calculations
  revenue:
    currency: USD
    decimal_places: 2
    rounding_method: "round"
  
  # Performance metrics
  kpis:
    target_aov: 150.0
    target_conversion_rate: 0.03
    target_customer_retention: 0.85

# Development and Testing
development:
  debug_mode: false
  test_data_size: 1000
  seed_value: 42
  auto_backup: true
  backup_retention_days: 30

# Deployment Settings
deployment:
  environment: development  # development, staging, production
  version: "1.0.0"
  auto_update: false
  health_check_interval: 300  # seconds 